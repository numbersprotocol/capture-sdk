name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Check version synchronization
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - &verify-actions-node
        name: Verify Actions Node.js security version
        run: |
          worker_executable=$(readlink -f "/proc/$PPID/exe")
          actions_node="$(dirname "$worker_executable")/../externals/node24/bin/node"
          "$actions_node" -e '
            console.log(`Actions runtime: ${process.version}`);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) process.exit(1);
          '

      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check version sync
        run: python scripts/sync-versions.py --check

  # Check feature parity
  feature-parity:
    name: Feature Parity Check
    runs-on: ubuntu-latest
    steps:
      - *verify-actions-node
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check feature parity
        run: python scripts/check-feature-parity.py

  # TypeScript CI
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.4", "24.22.1", "26.12.1"]
    defaults:
      run:
        working-directory: ts
    steps:
      - *verify-actions-node
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test Node.js runtime and package exports
        run: npm run test:runtime

  # Python CI
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - *verify-actions-node
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy numbersprotocol_capture --ignore-missing-imports

      - name: Run tests
        run: pytest -v

  # All checks passed
  ci-success:
    name: CI Success
    needs: [version-check, feature-parity, typescript, python]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All CI checks passed!"
